services:
  postgres:
    image: postgres:17-alpine
    container_name: settleup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: settleup
      POSTGRES_USER: settleup
      POSTGRES_PASSWORD: ${DB_PASSWORD:-settleup}
    ports:
      - "5432:5432"
    volumes:
      - settleup-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settleup -d settleup"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  settleup-pgdata:
