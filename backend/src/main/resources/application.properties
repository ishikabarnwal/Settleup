spring.application.name=SettleUp Backend

# Hosts like Render tell the app which port to listen on through PORT.
server.port=${PORT:8080}

# The defaults below are for local development only. The prod profile
# (application-prod.properties) replaces them with settings that have no defaults.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/settleup}
spring.datasource.username=${DB_USERNAME:settleup}
spring.datasource.password=${DB_PASSWORD:settleup}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=settleup
app.jwt.expiration=12h

app.idempotency.window=24h

# Swagger UI at /swagger-ui.html. Set API_DOCS_ENABLED=false to turn the docs off.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}

# Frontend origins allowed to call the API from a browser, comma separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
