# Production profile, turned on with SPRING_PROFILES_ACTIVE=prod (render.yaml does this).
# Nothing here falls back to a local value: every setting must come from the
# environment, and the app refuses to start if one is missing or blank
# (see ProductionSettings).

# Render hands out the database's host, port and name separately, so the JDBC URL
# is put together here.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.jwt.secret=${JWT_SECRET}

# Comma separated origins of the deployed frontend, exactly as the browser shows
# them: scheme and host, no path. For example
#   CORS_ALLOWED_ORIGINS=https://settleup.vercel.app
# Add a custom domain as a second entry when there is one.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# The API docs are off in production unless asked for.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

# Render terminates HTTPS in front of the app; trust its X-Forwarded-* headers so
# generated links (like the Swagger UI's server URL) use https.
server.forward-headers-strategy=framework
