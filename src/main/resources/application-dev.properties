# Local profile: in-memory H2 so the API can run without a database installed.
spring.datasource.url=jdbc:h2:mem:settleup;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-please-32+}
